name: 매일 데이터 갱신 + 사이트 배포

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 한국시간 화~토 06:30 (미국장 마감 후)
    - cron: "0 7 * * 1-5"     # 한국시간 월~금 16:00 (한국장 마감 후)
    - cron: "17 */4 * * *"    # 4시간마다 뉴스만 갱신 (시세·CTA는 건드리지 않음)
    - cron: "35 12,13 * * 1-5"  # 미국 동부 08:35 (장 시작 1시간 전) 브리핑 — 서머타임/표준시 둘 다 걸어 두고 스크립트가 맞는 쪽만 생성
    - cron: "10 20,21 * * 1-5"  # 미국 동부 16:10 (장 마감 직후) 브리핑
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼
    inputs:
      briefing:
        description: "브리핑 강제 생성 (none이면 일반 갱신)"
        type: choice
        default: none
        options: [none, pre, post]
  push:
    branches: [main]          # 리포트 파일을 올리면 바로 다시 배포

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 시세·CTA·공포탐욕 지수 갱신
        if: github.event_name != 'push' && !contains(fromJSON('["17 */4 * * *","35 12,13 * * 1-5","10 20,21 * * 1-5"]'), github.event.schedule) && (github.event_name != 'workflow_dispatch' || inputs.briefing == 'none')
        run: python scripts/update_data.py

      - name: 뉴스 브리핑 생성
        if: contains(fromJSON('["35 12,13 * * 1-5","10 20,21 * * 1-5"]'), github.event.schedule) || (github.event_name == 'workflow_dispatch' && inputs.briefing != 'none')
        run: python scripts/update_data.py briefing ${{ inputs.briefing || 'auto' }}

      - name: 뉴스만 갱신
        if: github.event.schedule == '17 */4 * * *'
        run: python scripts/update_data.py news

      - name: 사이트 생성
        run: python scripts/build_site.py

      - name: 갱신된 데이터 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" || echo "변경 없음"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
